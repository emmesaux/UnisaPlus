<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-labelledby="t d">
  <title id="t">Unisa Plus — Tutto il campus UNISA in un'unica app</title>
  <desc id="d">Banner di Unisa Plus: il monogramma architettonico U+ nei colori mare di Salerno e ambra, affiancato dalle schede animate di Libretto, Orario, Presenze QR e Mensa ADISURC.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D262A"/>
      <stop offset="55%" stop-color="#133B40"/>
      <stop offset="100%" stop-color="#16474D"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A555C"/>
      <stop offset="100%" stop-color="#0E2E33"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B952"/>
      <stop offset="100%" stop-color="#E8A33D"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#051315" flood-opacity="0.45"/>
    </filter>
  </defs>
  <style>
    .word { font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 56px; fill: #ECEAE2; letter-spacing: -1.5px; }
    .plus { fill: #E8A33D; }
    .tag { font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 500; font-size: 18px; fill: #B7C7C9; }
    .pill-txt { font-family: "SF Mono", "JetBrains Mono", "Consolas", monospace; font-weight: 700; font-size: 11.5px; fill: #ECEAE2; letter-spacing: 0.6px; }
    .card-title { font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #ECEAE2; }
    .card-sub { font-family: "SF Mono", "JetBrains Mono", "Consolas", monospace; font-weight: 600; font-size: 10.5px; fill: #9BB4B7; }
    .card-num { font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 22px; fill: #E8A33D; }
    .float1 { animation: floatA 6s ease-in-out infinite; }
    .float2 { animation: floatB 6s ease-in-out infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulseStar 4s ease-in-out infinite; }
    .scanline { animation: scan 3.6s ease-in-out infinite; }
    @keyframes floatA {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes floatB {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(5px); }
    }
    @keyframes pulseStar {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.08) rotate(8deg); opacity: 0.92; }
    }
    @keyframes scan {
      0%, 100% { transform: translateY(0px); opacity: 0.85; }
      50% { transform: translateY(34px); opacity: 1; }
    }
  </style>

  <!-- Background container -->
  <rect x="8" y="8" width="884" height="274" rx="22" fill="url(#bgGrad)" stroke="#265E66" stroke-width="1.5"/>

  <!-- Subtle architectural grid lines -->
  <g stroke="#ECEAE2" stroke-opacity="0.04" stroke-width="1">
    <line x1="8" y1="75" x2="892" y2="75"/>
    <line x1="8" y1="145" x2="892" y2="145"/>
    <line x1="8" y1="215" x2="892" y2="215"/>
    <line x1="205" y1="8" x2="205" y2="282"/>
    <line x1="600" y1="8" x2="600" y2="282"/>
  </g>

  <!-- App Icon Emblem (Left): Minimalist U+ with golden curve -->
  <g transform="translate(38, 68)" filter="url(#softShadow)">
    <rect x="0" y="0" width="150" height="150" rx="34" fill="url(#iconGrad)" stroke="#E8A33D" stroke-opacity="0.38" stroke-width="1.5"/>
    <!-- Stylized U -->
    <path d="M 39 43 L 39 86 C 39 106 53.5 118 75 118 C 96.5 118 111 106 111 86 L 111 64" fill="none" stroke="#ECEAE2" stroke-width="15.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Golden Academic "+" Accent (nested <g> so CSS transform never resets translate!) -->
    <g transform="translate(111, 41)">
      <g class="pulse">
        <rect x="-15.5" y="-4.75" width="31" height="9.5" rx="4.75" fill="url(#goldGrad)"/>
        <rect x="-4.75" y="-15.5" width="9.5" height="31" rx="4.75" fill="url(#goldGrad)"/>
      </g>
    </g>
    <!-- Subtle golden wave / book base line -->
    <path d="M 49 131.5 Q 75 137.5 101 131.5" fill="none" stroke="#E8A33D" stroke-width="3.8" stroke-linecap="round" opacity="0.82"/>
  </g>

  <!-- Brand Title & Subtitle (Center) -->
  <g transform="translate(214, 0)">
    <text x="0" y="112" class="word">Unisa <tspan class="plus">Plus</tspan></text>
    <text x="2" y="146" class="tag">L'ecosistema digitale per gli studenti UNISA.</text>
    <text x="2" y="172" class="tag">Carriera, orari, presenze e mensa in un solo posto.</text>

    <!-- Feature badges row -->
    <g transform="translate(2, 198)">
      <rect x="0" y="0" width="72" height="26" rx="6" fill="#1B5259" stroke="#31747D" stroke-width="1"/>
      <text x="36" y="17" text-anchor="middle" class="pill-txt">ESSE3</text>

      <rect x="80" y="0" width="98" height="26" rx="6" fill="#1B5259" stroke="#31747D" stroke-width="1"/>
      <text x="129" y="17" text-anchor="middle" class="pill-txt">EASYBADGE</text>

      <rect x="186" y="0" width="88" height="26" rx="6" fill="#1B5259" stroke="#31747D" stroke-width="1"/>
      <text x="230" y="17" text-anchor="middle" class="pill-txt">ADISURC</text>

      <rect x="282" y="0" width="92" height="26" rx="6" fill="#1B5259" stroke="#31747D" stroke-width="1"/>
      <text x="328" y="17" text-anchor="middle" class="pill-txt">EASYROOM</text>
    </g>
  </g>

  <!-- Right Interactive UI Preview Cards -->
  <!-- Card 1: Libretto & Previsione Laurea -->
  <g transform="translate(622, 34)" filter="url(#softShadow)">
    <g class="float1">
      <rect x="0" y="0" width="244" height="98" rx="12" fill="#14181B" stroke="#2B4E53" stroke-width="1.2"/>
      <text x="16" y="26" class="card-sub">LIBRETTO · PREVISIONE LAUREA</text>
      <text x="16" y="56" class="card-num">28.6 <tspan font-size="13" fill="#7CE2B3" font-weight="700">→ 108/110</tspan></text>
      <rect x="16" y="70" width="154" height="6" rx="3" fill="#233236"/>
      <rect x="16" y="70" width="128" height="6" rx="3" fill="#2E7D5B"/>
      <text x="180" y="77" class="card-sub" fill="#ECEAE2">144 CFU</text>
    </g>
  </g>

  <!-- Card 2: EasyBadge QR & Mensa TOTP -->
  <g transform="translate(610, 150)" filter="url(#softShadow)">
    <g class="float2">
      <rect x="0" y="0" width="256" height="104" rx="12" fill="#14181B" stroke="#E8A33D" stroke-opacity="0.45" stroke-width="1.2"/>
      <g transform="translate(16, 18)">
        <rect x="0" y="0" width="68" height="68" rx="8" fill="#ECEAE2"/>
        <rect x="8" y="8" width="18" height="18" rx="2" fill="#14181B"/>
        <rect x="12" y="12" width="10" height="10" fill="#ECEAE2"/>
        <rect x="14" y="14" width="6" height="6" fill="#14181B"/>
        <rect x="42" y="8" width="18" height="18" rx="2" fill="#14181B"/>
        <rect x="46" y="12" width="10" height="10" fill="#ECEAE2"/>
        <rect x="48" y="14" width="6" height="6" fill="#14181B"/>
        <rect x="8" y="42" width="18" height="18" rx="2" fill="#14181B"/>
        <rect x="12" y="46" width="10" height="10" fill="#ECEAE2"/>
        <rect x="14" y="48" width="6" height="6" fill="#14181B"/>
        <rect x="32" y="32" width="8" height="8" fill="#14181B"/>
        <rect x="44" y="36" width="14" height="6" fill="#14181B"/>
        <rect x="34" y="46" width="10" height="14" fill="#14181B"/>
        <rect x="48" y="48" width="12" height="12" fill="#16474D"/>
        <g transform="translate(0, 14)">
          <line x1="4" y1="0" x2="64" y2="0" stroke="#E8A33D" stroke-width="2.5" stroke-linecap="round" class="scanline"/>
        </g>
      </g>
      <text x="98" y="34" class="card-title">Presenze &amp; Mensa QR</text>
      <text x="98" y="54" class="card-sub">Timbratura aula con/senza login</text>
      <text x="98" y="71" class="card-sub">QR dinamico ADISURC + Menù</text>
      <circle cx="104" cy="86" r="4" fill="#2E7D5B"/>
      <text x="114" y="90" class="card-sub" fill="#7CE2B3">ATTIVO · SINCRONIZZATO</text>
    </g>
  </g>
</svg>
