<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-labelledby="t d">
  <title id="t">Unisa+ — Tutto il campus UNISA in un'unica app</title>
  <desc id="d">Banner di Unisa+: il monogramma architettonico U+ nei colori mare di Salerno e ambra, affiancato dalle schede animate di Libretto, Orario, Presenze QR e Mensa ADISURC.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D262A"/>
      <stop offset="55%" stop-color="#133B40"/>
      <stop offset="100%" stop-color="#16474D"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A555C"/>
      <stop offset="100%" stop-color="#0E2E33"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B952"/>
      <stop offset="100%" stop-color="#E8A33D"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#051315" flood-opacity="0.45"/>
    </filter>
  </defs>
  <style>
    .word { font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 64px; fill: #ECEAE2; letter-spacing: -1.8px; }
    .plus { fill: #E8A33D; }
    .tag { font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 500; font-size: 19px; fill: #B7C7C9; }
    .pill-txt { font-family: "SF Mono", "JetBrains Mono", "Consolas", monospace; font-weight: 700; font-size: 12px; fill: #ECEAE2; letter-spacing: 0.6px; }
    .card-title { font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #ECEAE2; }
    .card-sub { font-family: "SF Mono", "JetBrains Mono", "Consolas", monospace; font-weight: 600; font-size: 11px; fill: #9BB4B7; }
    .card-num { font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 22px; fill: #E8A33D; }
    .float1 { animation: floatA 6s ease-in-out infinite; }
    .float2 { animation: floatB 6s ease-in-out infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulseStar 4s ease-in-out infinite; }
    .scanline { animation: scan 3.6s ease-in-out infinite; }
    @keyframes floatA {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatB {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes pulseStar {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.08) rotate(8deg); opacity: 0.92; }
    }
    @keyframes scan {
      0%, 100% { transform: translateY(0px); opacity: 0.85; }
      50% { transform: translateY(24px); opacity: 1; }
    }
  </style>

  <!-- Background container -->
  <rect x="8" y="8" width="884" height="274" rx="22" fill="url(#bgGrad)" stroke="#265E66" stroke-width="1.5"/>

  <!-- Subtle architectural grid lines -->
  <g stroke="#ECEAE2" stroke-opacity="0.04" stroke-width="1">
    <line x1="8" y1="75" x2="892" y2="75"/>
    <line x1="8" y1="145" x2="892" y2="145"/>
    <line x1="8" y1="215" x2="892" y2="215"/>
    <line x1="185" y1="8" x2="185" y2="282"/>
    <line x1="560" y1="8" x2="560" y2="282"/>
    <line x1="730" y1="8" x2="730" y2="282"/>
  </g>

  <!-- App Icon Emblem (Left) -->
  <g transform="translate(44, 57)" filter="url(#softShadow)">
    <rect x="0" y="0" width="146" height="146" rx="34" fill="url(#iconGrad)" stroke="#E8A33D" stroke-opacity="0.35" stroke-width="1.5"/>
    <!-- Stylized U -->
    <path d="M 38 42 L 38 84 C 38 103 52 115 73 115 C 94 115 108 103 108 84 L 108 62" fill="none" stroke="#ECEAE2" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Golden Academic Star / Plus Accent -->
    <g class="pulse" transform="translate(108, 40)">
      <rect x="-15" y="-4.5" width="30" height="9" rx="4.5" fill="url(#goldGrad)"/>
      <rect x="-4.5" y="-15" width="9" height="30" rx="4.5" fill="url(#goldGrad)"/>
    </g>
    <!-- Subtle wave / book base line -->
    <path d="M 48 128 Q 73 134 98 128" fill="none" stroke="#E8A33D" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Brand Title & Subtitle (Center) -->
  <g transform="translate(216, 0)">
    <text x="0" y="114" class="word">Unisa<tspan class="plus">+</tspan></text>
    <text x="2" y="148" class="tag">L'ecosistema digitale per gli studenti UNISA.</text>
    <text x="2" y="174" class="tag">Carriera, orari, presenze e mensa in un solo posto.</text>

    <!-- Feature badges row -->
    <g transform="translate(2, 198)">
      <rect x="0" y="0" width="76" height="26" rx="6" fill="#1B5259" stroke="#31747D" stroke-width="1"/>
      <text x="38" y="17" text-anchor="middle" class="pill-txt">ESSE3</text>

      <rect x="84" y="0" width="102" height="26" rx="6" fill="#1B5259" stroke="#31747D" stroke-width="1"/>
      <text x="135" y="17" text-anchor="middle" class="pill-txt">EASYBADGE</text>

      <rect x="194" y="0" width="92" height="26" rx="6" fill="#1B5259" stroke="#31747D" stroke-width="1"/>
      <text x="240" y="17" text-anchor="middle" class="pill-txt">ADISURC</text>

      <rect x="294" y="0" width="96" height="26" rx="6" fill="#1B5259" stroke="#31747D" stroke-width="1"/>
      <text x="342" y="17" text-anchor="middle" class="pill-txt">EASYROOM</text>
    </g>
  </g>

  <!-- Right Interactive UI Preview Cards -->
  <!-- Card 1: Libretto & Previsione Laurea -->
  <g class="float1" transform="translate(632, 34)" filter="url(#softShadow)">
    <rect x="0" y="0" width="232" height="98" rx="12" fill="#14181B" stroke="#2B4E53" stroke-width="1.2"/>
    <text x="16" y="26" class="card-sub">LIBRETTO · PREVISIONE LAUREA</text>
    <text x="16" y="56" class="card-num">28.6 <tspan font-size="13" fill="#7CE2B3" font-weight="700">→ 108/110</tspan></text>
    <!-- Mini bar chart -->
    <rect x="16" y="70" width="150" height="6" rx="3" fill="#233236"/>
    <rect x="16" y="70" width="124" height="6" rx="3" fill="#2E7D5B"/>
    <text x="176" y="77" class="card-sub" fill="#ECEAE2">144 CFU</text>
  </g>

  <!-- Card 2: EasyBadge QR & Mensa TOTP -->
  <g class="float2" transform="translate(608, 150)" filter="url(#softShadow)">
    <rect x="0" y="0" width="256" height="104" rx="12" fill="#14181B" stroke="#E8A33D" stroke-opacity="0.45" stroke-width="1.2"/>
    <!-- Mini QR Box -->
    <g transform="translate(16, 18)">
      <rect x="0" y="0" width="68" height="68" rx="8" fill="#ECEAE2"/>
      <rect x="8" y="8" width="18" height="18" rx="2" fill="#14181B"/>
      <rect x="12" y="12" width="10" height="10" fill="#ECEAE2"/>
      <rect x="14" y="14" width="6" height="6" fill="#14181B"/>
      <rect x="42" y="8" width="18" height="18" rx="2" fill="#14181B"/>
      <rect x="46" y="12" width="10" height="10" fill="#ECEAE2"/>
      <rect x="48" y="14" width="6" height="6" fill="#14181B"/>
      <rect x="8" y="42" width="18" height="18" rx="2" fill="#14181B"/>
      <rect x="12" y="46" width="10" height="10" fill="#ECEAE2"/>
      <rect x="14" y="48" width="6" height="6" fill="#14181B"/>
      <rect x="32" y="32" width="8" height="8" fill="#14181B"/>
      <rect x="44" y="36" width="14" height="6" fill="#14181B"/>
      <rect x="34" y="46" width="10" height="14" fill="#14181B"/>
      <rect x="48" y="48" width="12" height="12" fill="#16474D"/>
      <!-- Animated laser scan line -->
      <line x1="4" y1="22" x2="64" y2="22" stroke="#E8A33D" stroke-width="2.5" stroke-linecap="round" class="scanline"/>
    </g>
    <text x="98" y="34" class="card-title">Presenze &amp; Mensa QR</text>
    <text x="98" y="54" class="card-sub">Timbratura aula con/senza login</text>
    <text x="98" y="71" class="card-sub">QR dinamico ADISURC + Saldo</text>
    <circle cx="104" cy="86" r="4" fill="#2E7D5B"/>
    <text x="114" y="90" class="card-sub" fill="#7CE2B3">ATTIVO · SINCRONIZZATO</text>
  </g>
</svg>

