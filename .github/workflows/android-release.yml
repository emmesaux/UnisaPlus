name: "Android Build & GitHub Release (APK)"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag della Release (es. v1.0.0 — lascia vuoto per usare la versione di pubspec.yaml)"
        required: false
        type: string
        default: ""
      create_github_release:
        description: "Pubblica l'APK nella sezione Releases di GitHub"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Android Keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Configurazione keystore di produzione da GitHub Secrets..."
            echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          else
            echo "Nessun keystore personalizzato nei Secrets: uso firma automatica per APK installabile."
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Extract Version & Tag
        id: meta
        run: |
          PUB_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          INPUT_TAG="${{ inputs.release_tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${PUB_VER}"
          fi
          echo "version=${PUB_VER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Building Unisa Plus version ${PUB_VER} (tag: ${TAG})"

      - name: Build Universal APK (Release, Obfuscated)
        run: flutter build apk --release --obfuscate --split-debug-info=build/debug-info/universal

      - name: Build Split-per-ABI APKs (arm64-v8a / armeabi-v7a, Obfuscated)
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info/abi

      - name: Prepare Release Files
        run: |
          mkdir -p dist
          TAG="${{ steps.meta.outputs.tag }}"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/UnisaPlus-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/UnisaPlus-${TAG}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/UnisaPlus-${TAG}-armeabi-v7a.apk"
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unisaplus-android-apk-${{ steps.meta.outputs.tag }}
          path: dist/*.apk

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || inputs.create_github_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Unisa Plus ${{ steps.meta.outputs.tag }}"
          body: |
            ## Unisa Plus ${{ steps.meta.outputs.tag }} (Android)

            Scarica e installa direttamente l'app sul tuo smartphone Android:
            - **`UnisaPlus-${{ steps.meta.outputs.tag }}.apk`** — Versione universale (consigliata, compatibile con tutti i dispositivi Android)
            - **`UnisaPlus-${{ steps.meta.outputs.tag }}-arm64-v8a.apk`** — Versione leggera ottimizzata per smartphone moderni a 64-bit

            ### Funzionalità incluse
            - Orario delle lezioni, Aule libere (con dettaglio fascia oraria giornaliera), Avvisi di Ateneo e Dipartimento
            - Libretto universitario con statistiche, grafici e simulatore voto di laurea
            - Appelli d'esame, Bacheca esiti e Situazione Tasse (Esse3)
            - Tesserino digitale e Rilevazione/Consultazione Presenze EasyBadge (con e senza accesso)
            - Mensa ADISURC con saldo, QR code dinamico e menù del giorno/settimana (Pranzo e Cena)
          files: |
            dist/UnisaPlus-${{ steps.meta.outputs.tag }}.apk
            dist/UnisaPlus-${{ steps.meta.outputs.tag }}-arm64-v8a.apk
            dist/UnisaPlus-${{ steps.meta.outputs.tag }}-armeabi-v7a.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

